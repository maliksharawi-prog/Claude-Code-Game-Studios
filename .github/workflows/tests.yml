name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Domain-purity CI guard — L2 (ADR-004 §6 / story E01-003). Pure ripgrep,
  # needs NO Unity license, so it runs first and fails fast if a forbidden
  # token (System.Random, UnityEngine/UnityEditor, DateTime.Now, etc.) lands
  # in src/SweetCascade/Assets/Domain/. The `test` job below depends on this
  # one, so a purity failure blocks the PR/push before any Unity spin-up.
  domain-purity:
    name: Domain Purity Scan (L2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Proves the guard itself is armed (injects a known violation into a
      # disposable temp copy, asserts non-zero, then asserts a clean re-scan)
      # before trusting the real scan below — a vacuously-passing scan of an
      # empty/near-empty Assets/Domain/ tree would otherwise prove nothing.
      - name: Self-test the domain-purity guard
        shell: bash
        run: tools/ci/domain-purity-scan.sh --self-test

      - name: Scan src/SweetCascade/Assets/Domain/ for forbidden tokens
        shell: bash
        run: tools/ci/domain-purity-scan.sh

  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    needs: domain-purity

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Guard: the Unity project is created during the Technical Setup phase.
      # Until a ProjectSettings/ProjectVersion.txt exists (expected under
      # src/SweetCascade/), skip the test run with a notice instead of failing.
      # Engine pin: Unity 6.3 LTS per ADR-001.
      - name: Check for Unity project
        id: project_check
        shell: bash
        run: |
          shopt -s globstar nullglob
          hits=(**/ProjectSettings/ProjectVersion.txt)
          if [ ${#hits[@]} -gt 0 ]; then
            echo "project_exists=true" >> "$GITHUB_OUTPUT"
            echo "project_path=$(dirname "$(dirname "${hits[0]}")")" >> "$GITHUB_OUTPUT"
          else
            echo "project_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity project not found yet — skipping tests until the project scaffold lands (see tests/README.md)."
          fi

      # Requires repository secrets UNITY_LICENSE (or UNITY_EMAIL/UNITY_PASSWORD
      # for personal license activation) before the first real run — see
      # tests/README.md.
      - name: Run Unity Test Framework (Edit + Play mode)
        if: steps.project_check.outputs.project_exists == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ steps.project_check.outputs.project_path }}
          testMode: all
          artifactsPath: test-results

      - name: Upload Test Results
        if: always() && steps.project_check.outputs.project_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
